    // 🚀 ページ定義
    const pages = {

                </article>
                <article class="hero-slide has-media">
                  <div class="hero-content">
                    <h2 class="hero-slide-title" data-i18n="heroSlide2">穏やかに興味にふれる</h2>
                  </div>
                  <div class="hero-media">
                    <img src="assets/app/1.png" alt="穏やかに興味にふれる" loading="lazy">

                </article>
                <article class="hero-slide has-media">
                  <div class="hero-content">
                    <h2 class="hero-slide-title" data-i18n="heroSlide3">他の興味も探せる</h2>
                  </div>
                  <div class="hero-media">
                    <img src="assets/app/2.png" alt="他の興味も探せる" loading="lazy">
                  </div>
                </article>
                <article class="hero-slide has-media">
                  <div class="hero-content">
                    <h2 class="hero-slide-title" data-i18n="heroSlide4">興味が共有される</h2>
                  </div>
                  <div class="hero-media">
                    <img src="assets/app/3.png" alt="興味が共有される" loading="lazy">

              </div>
            </div>

        </section>
        <section class="section">
          <div class="container">
            <h2 class="section-title" data-i18n="companyTitle">会社概要</h2>
            <div class="company-card fade-in">
              <div class="company-grid">
                <div class="company-label" data-i18n="companyNameLabel">社名</div>
                <div class="company-value" data-i18n="companyNameValue">Ａｕｄｒｅｙ合同会社</div>
                <div class="company-label" data-i18n="companyLocationLabel">所在地</div>
                <div class="company-value" data-i18n="companyLocationValue">大阪府吹田市山手町3−9−13-207</div>
                <div class="company-label" data-i18n="companyFoundedLabel">設立</div>
                <div class="company-value" data-i18n="companyFoundedValue">2024年4月17日</div>
                <div class="company-label" data-i18n="companyRepLabel">代表</div>
                <div class="company-value" data-i18n="companyRepValue">中村研斗</div>
                <div class="company-label" data-i18n="companyBizLabel">事業内容</div>
                <div class="company-value" data-i18n="companyBizValue">モバイルアプリケーションの企画・開発・運営</div>
              </div>
            </div>
          </div>
        </section>
      `,
      adry: `
        <section class="adry-page">
          <a class="adry-home-button" href="/" onclick="navigateTo('home'); return false;" aria-label="ホームへ戻る">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter" />
            </svg>
          </a>
          <div class="adry-scroll" data-adry-scroll>
            <section class="adry-section adry-text-white" data-adry-section style="background-color:#16171B;">
              <div class="adry-section-inner">
                <div class="adry-section-grid">
                  <div class="adry-section-text">
                    <h2 class="adry-section-title">Adryはデジタルメディアを再定義します</h2>
                    <p class="adry-section-desc">今やデジタルメディアは混沌の渦の中です。多くの情報が錯綜し日々の生活の中に溶け込んでいます。私たちにとって本当に必要なものは何なのか、これからの時代をどう生きていくか。これは大きなテーマでもあります。<br>Adryは従来のデジタルメディアを再定義し必要な情報と、情報を受け取る感覚や感性をより良いものにするために作られたアプリケーションです。</p>
                  </div>
                  <div class="adry-section-art">
                    <svg viewBox="0 0 100 160" class="adry-line" aria-hidden="true">
                      <path d="M 18,38 Q 45,28 82,36" data-adry-path></path>
                      <path d="M 16,70 Q 48,60 85,70" data-adry-path></path>
                      <path d="M 38,52 Q 32,92 54,116 Q 70,135 86,142" data-adry-path></path>
                    </svg>
                  </div>
                </div>
              </div>
            </section>
            <section class="adry-section" data-adry-section style="background-color:#1E1F24;">
              <div class="adry-section-inner">
                <div class="adry-section-grid">
                  <div class="adry-section-text">
                    <h2 class="adry-section-title">徹底的にオフラインを表現</h2>
                    <p class="adry-section-desc">オンラインはさまざまなテクノロジーでありふれて、今や異空間です。私たちがオンラインを楽しめるのはオフラインがあるからです。そして人生はオフラインによって左右します。オフラインを研究しオフラインに最も近いテクノロジーツールを目指します。</p>
                  </div>
                  <div class="adry-section-art">
                    <svg viewBox="0 0 100 160" class="adry-line" aria-hidden="true">
                      <path d="M 25,40 Q 70,45 70,70 Q 70,92 45,106 Q 30,116 35,136" data-adry-path></path>
                    </svg>
                  </div>
                </div>
              </div>
            </section>
            <section class="adry-section adry-text-white" data-adry-section style="background-color:#111215;">
              <div class="adry-section-inner">
                <div class="adry-final-card">
                  <div class="adry-final-phone">
                    <img src="assets/adry/final-phone.jpg" alt="Adryアプリ画面" loading="lazy">
                  </div>
                  <div class="adry-final-content">
                    <h3 class="adry-final-headline">App Store で配信中</h3>
                    <a class="adry-store-button" href="https://apps.apple.com/app/adry/id6739618192" target="_blank" rel="noopener noreferrer">
                      Download on the App Store

                </div>
              </div>
            </section>
          </div>
        </section>
      `
    };

    let heroTimer = null;
    let adryCleanup = null;

    function setupHeroSlider() {
      const slider = document.querySelector('[data-hero-slider]');
      if (!slider) return;
      const slides = Array.from(slider.querySelectorAll('.hero-slide'));
      if (!slides.length) return;
      let currentIndex = 0;
      function showNextSlide() {
        slides[currentIndex].classList.remove('is-active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('is-active');
      }
      heroTimer = window.setInterval(showNextSlide, 4500);
    }

    function stopHeroSlider() {
      if (heroTimer) {
        clearInterval(heroTimer);
        heroTimer = null;
      }
    }

    function setupAdryPage() {
      const container = document.querySelector('[data-adry-scroll]');
      if (!container) return;
      const sections = Array.from(container.querySelectorAll('[data-adry-section]'));
      if (!sections.length) return;
      let isScrolling = false;

      function lineCleanup() {
        sections.forEach(s => {
          s.querySelectorAll('[data-adry-path]').forEach(p => p.classList.remove('is-drawing'));
        });
      }

      function handleScroll() {
        if (isScrolling) return;
        const currentPos = container.scrollTop;
        const windowHeight = window.innerHeight;
        const targetIndex = Math.round(currentPos / windowHeight);
        sections.forEach((sec, idx) => {
          if (idx === targetIndex) {
            sec.querySelectorAll('[data-adry-path]').forEach(p => p.classList.add('is-drawing'));
          } else {
            sec.querySelectorAll('[data-adry-path]').forEach(p => p.classList.remove('is-drawing'));
          }
        });
      }

      container.addEventListener('scroll', handleScroll, { passive: true });
      adryCleanup = function () {
        container.removeEventListener('scroll', handleScroll);
        lineCleanup();
      };
    }

    function stopAdryPage() {
      if (!adryCleanup) return;
      adryCleanup();
      adryCleanup = null;
    }

    function resolvePageKey() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('page') === 'adry') return 'adry';
      const pathname = window.location.pathname;
      if (pathname === '/adry' || pathname === '/adry/') return 'adry';
      return 'home';
    }

    function navigateTo(key, options = { updateUrl: true }) {
      stopHeroSlider();
      stopAdryPage();
      const content = document.getElementById('content');
      document.querySelectorAll('nav button, nav a').forEach(el => el.removeAttribute('aria-current'));

      const active = document.getElementById(`nav-${key}`);
      if (active) active.setAttribute('aria-current', 'page');

      document.body.classList.toggle('adry-mode', key === 'adry');

      if (options.updateUrl) {
        if (key === 'adry') {
          history.pushState({}, '', '/?page=adry');
        } else {
          history.pushState({}, '', '/');
        }
      }

      content.classList.add('fade-enter');
      setTimeout(() => {
        content.innerHTML = pages[key] || pages.home;
        content.classList.remove('fade-enter');
        content.classList.add('fade-enter-active');
        setTimeout(() => content.classList.remove('fade-enter-active'), 300);
        setupHeroSlider();
        setupAdryPage();
        if (window.adryI18n) {
          window.adryI18n.setLanguage(window.adryI18n.getLanguage());
        }
      }, 100);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const initialKey = resolvePageKey();
      navigateTo(initialKey, { updateUrl: false });
    });

    window.addEventListener('popstate', () => {
      const nextKey = resolvePageKey();
      navigateTo(nextKey, { updateUrl: false });
    });
  </script>
